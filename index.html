<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Smart — POS & ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
:root{--bg:#070b13;--panel:#0d1422;--panel2:#111b2d;--line:#20304a;--txt:#edf4ff;--muted:#91a1ba;--blue:#4aa3ff;--purple:#8b6cff;--green:#45df9a;--red:#ff5f70;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#14274a 0,transparent 35%),radial-gradient(circle at 90% 10%,#26164a 0,transparent 32%),var(--bg);color:var(--txt);font-family:Cairo,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#0d1422dd;border:1px solid #29415f;border-radius:24px;padding:30px;box-shadow:0 25px 80px #0009;backdrop-filter:blur(18px)}.logo{font-size:30px;font-weight:800}.logo b{color:var(--blue)}.sub{color:var(--muted);margin:6px 0 25px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;color:#aebbd0}.field input,.field select,.field textarea{width:100%;background:#08101d;border:1px solid var(--line);color:var(--txt);padding:12px 13px;border-radius:12px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.btn{padding:11px 15px;border-radius:12px;color:#fff;background:#18263b;border:1px solid #2a3d59}.btn.primary{background:linear-gradient(135deg,#287ee5,#7358e9);border:0}.btn.green{background:#123b2c;color:#70f2b1;border:1px solid #236b4e}.btn.red{background:#3a1720;color:#ff8c98;border:1px solid #6b2634}.btn.sm{padding:7px 10px;font-size:12px}.msg{min-height:22px;color:#ff8b97;font-size:13px}
#app{display:none;min-height:100vh}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#08101bdd;border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:21px;padding:8px 6px 18px}.brand span{color:var(--blue)}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#aab8cc;text-align:right;padding:12px;border-radius:11px}.nav button:hover,.nav button.active{background:#15233a;color:#fff}.userbox{position:absolute;bottom:15px;left:15px;right:15px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:12px}
.main{padding:22px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{font-size:24px;margin:0}.top p{margin:3px 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#0d1625dc;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 35px #0003}.metric .v{font-size:26px;font-weight:800;margin-top:7px}.metric .l{color:var(--muted);font-size:12px}.blue{color:#6ab4ff}.green-t{color:#5de6a5}.yellow-t{color:#ffd166}.red-t{color:#ff7786}
.panel{background:#0d1625dc;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px}.panel h3{margin:0 0 13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{background:#08101d;border:1px solid var(--line);color:#fff;border-radius:11px;padding:10px}.toolbar input{min-width:220px;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 9px;border-bottom:1px solid #1a2940;text-align:right;vertical-align:middle}th{color:#9eb0c8;font-weight:600}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#13233a;color:#91c8ff;font-size:11px}.empty{text-align:center;color:var(--muted);padding:30px}
.pos{display:grid;grid-template-columns:1.45fr .8fr;gap:14px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-height:62vh;overflow:auto}.prod{padding:13px;border-radius:14px;background:#101d31;border:1px solid #20344f;text-align:right}.prod:hover{border-color:#4b7db0}.prod .name{font-weight:700}.prod .meta{font-size:11px;color:var(--muted);margin:4px 0 9px}.cart{position:sticky;top:15px;height:max-content}.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #1a2940}.qty{display:flex;align-items:center;gap:5px}.qty button{width:25px;height:25px;border-radius:7px;background:#1a2a41;color:#fff}.totals{display:grid;gap:7px;margin-top:12px}.totalrow{display:flex;justify-content:space-between;color:#aebbd0}.grand{font-size:20px;font-weight:800;color:#fff;border-top:1px solid var(--line);padding-top:10px}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:50}.modal.show{display:grid}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0c1524;border:1px solid #2a4160;border-radius:20px;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}.receipt{width:80mm;background:#fff;color:#000;padding:7mm;margin:auto;font-family:Arial,sans-serif}.receipt h2,.receipt p{text-align:center;margin:4px 0}.receipt table{color:#000;font-size:12px}.receipt th,.receipt td{border-bottom:1px dashed #999;padding:4px}.receipt .r-total{font-size:17px;font-weight:bold;display:flex;justify-content:space-between;margin-top:8px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.layout{display:block}.side{height:auto;position:relative;border-left:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.userbox{position:static;margin-top:10px}.main{padding:13px}.cards{grid-template-columns:1fr 1fr}.grid2,.formgrid{grid-template-columns:1fr}.products{grid-template-columns:1fr}.top h1{font-size:19px}}
@media print{body{background:#fff}.layout,#login{display:none!important}.modal{position:static;background:#fff;display:block!important}.modalbox{border:0;padding:0;max-height:none}.no-print{display:none!important}.receipt{width:80mm}}
</style>
</head>
<body>
<section id="login">
  <div class="login-card">
    <div class="logo">ALPHA <b>SMART</b></div>
    <div class="sub">نظام نقاط بيع وإدارة متجر</div>
    <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%;margin-top:8px" id="loginBtn">دخول النظام</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</section>

<div id="app">
<div class="layout">
<aside class="side">
  <div class="brand">ALPHA <span>SMART</span></div>
  <div class="nav">
    <button data-page="dashboard" class="active">الرئيسية</button>
    <button data-page="pos">نقطة البيع</button>
    <button data-page="products">المنتجات</button>
    <button data-page="sales">الفواتير</button>
    <button data-page="purchases">المشتريات</button>
    <button data-page="customers">العملاء</button>
    <button data-page="suppliers">الموردون</button>
    <button data-page="expenses">المصروفات</button>
    <button data-page="stock">المخزون</button>
    <button data-page="cash">الصندوق</button>
    <button data-page="reports">التقارير</button>
    <button data-page="settings">الإعدادات</button>
  </div>
  <div class="userbox" id="userBox"></div>
</aside>
<main class="main">
  <div class="top"><div><h1 id="pageTitle">الرئيسية</h1><p id="companyLine">جاري التحميل...</p></div><div class="actions"><button class="btn sm" id="refreshBtn">تحديث</button><button class="btn sm red" id="logoutBtn">خروج</button></div></div>
  <div id="content"></div>
</main>
</div>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>

<script>
const SUPABASE_URL="https://sdvbesezfojuoxlytbbt.supabase.co";
const SUPABASE_KEY="sb_publishable_9TkfjUai4MUO_5sBQEoeiw_0vNsW3My";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, profile=null, company=null, branch=null, products=[], cart=[], customers=[], settings={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>new Intl.NumberFormat("ar-EG",{style:"currency",currency:company?.currency_code||"EGP",maximumFractionDigits:2}).format(Number(n||0));
const toast=m=>alert(m);
async function api(q){const {data,error}=await q;if(error)throw error;return data}
async function boot(){
 const {data:{session:s}}=await sb.auth.getSession(); if(!s){$("login").style.display="grid";return}
 session=s;
 try{
   profile=await api(sb.from("profiles").select("*").eq("id",s.user.id).maybeSingle());
   if(!profile)throw new Error("لا يوجد Profile لهذا المستخدم. أنشئ profiles بنفس auth.users.id.");
   company=await api(sb.from("companies").select("*").eq("id",profile.company_id).single());
   branch=profile.branch_id?await api(sb.from("branches").select("*").eq("id",profile.branch_id).maybeSingle()):null;
   settings=await api(sb.from("settings").select("*").eq("company_id",company.id).maybeSingle())||{};
   $("login").style.display="none";$("app").style.display="block";
   $("userBox").innerHTML=`${esc(profile.display_name||session.user.email)}<br><span class="tag">${esc(profile.role)}</span>`;
   $("companyLine").textContent=`${company.name}${branch?" — "+branch.name:""}`;
   await navigate("dashboard");
 }catch(e){$("loginMsg").textContent=e.message||"حدث خطأ";await sb.auth.signOut();$("login").style.display="grid";$("app").style.display="none"}
}
$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="جاري الدخول...";
 const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 $("loginMsg").textContent=error?error.message:""; if(!error)boot();
};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("refreshBtn").onclick=()=>navigate(currentPage);
let currentPage="dashboard";
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>navigate(b.dataset.page));
async function navigate(page){currentPage=page;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("pageTitle").textContent={dashboard:"الرئيسية",pos:"نقطة البيع",products:"المنتجات",sales:"الفواتير",purchases:"المشتريات",customers:"العملاء",suppliers:"الموردون",expenses:"المصروفات",stock:"المخزون",cash:"الصندوق",reports:"التقارير",settings:"الإعدادات"}[page];try{await pages[page]()}catch(e){$("content").innerHTML=`<div class="panel"><b>خطأ</b><p>${esc(e.message)}</p></div>`}}

const pages={
dashboard:async()=>{
 const [sales,prods,cust,exp]=await Promise.all([
   api(sb.from("sales").select("total,status,created_at").eq("company_id",company.id).eq("status","completed")),
   api(sb.from("stock").select("quantity,min_stock,product_id").eq("company_id",company.id).eq("branch_id",branch?.id||"00000000-0000-0000-0000-000000000000")),
   api(sb.from("customers").select("balance_due").eq("company_id",company.id)),
   api(sb.from("expenses").select("amount,created_at").eq("company_id",company.id))
 ]);
 const today=new Date().toISOString().slice(0,10), ts=sales.filter(x=>x.created_at?.slice(0,10)===today).reduce((a,x)=>a+Number(x.total),0), low=prods.filter(x=>Number(x.quantity)<=Number(x.min_stock??0)).length, due=cust.reduce((a,x)=>a+Number(x.balance_due||0),0);
 $("content").innerHTML=`<div class="cards">
 <div class="card metric"><div class="l">مبيعات اليوم</div><div class="v blue">${money(ts)}</div></div>
 <div class="card metric"><div class="l">إجمالي الفواتير</div><div class="v">${sales.length}</div></div>
 <div class="card metric"><div class="l">نواقص المخزون</div><div class="v yellow-t">${low}</div></div>
 <div class="card metric"><div class="l">مديونية العملاء</div><div class="v red-t">${money(due)}</div></div></div>
 <div class="grid2"><div class="panel"><h3>اختصارات</h3><div class="actions"><button class="btn primary" onclick="navigate('pos')">فتح نقطة البيع</button><button class="btn" onclick="openProduct()">إضافة منتج</button><button class="btn" onclick="navigate('sales')">الفواتير</button><button class="btn" onclick="navigate('stock')">المخزون</button></div></div>
 <div class="panel"><h3>النظام</h3><p style="color:var(--muted)">قاعدة البيانات: Supabase<br>الشركة: ${esc(company.name)}<br>الفرع: ${esc(branch?.name||"غير محدد")}</p></div></div>`;
},
pos:async()=>{
 products=await api(sb.from("products").select("*").eq("company_id",company.id).eq("is_active",true).order("name"));
 customers=await api(sb.from("customers").select("*").eq("company_id",company.id).order("name"));
 renderPOS();
},
products:async()=>{
 products=await api(sb.from("products").select("*,categories(name),units(name,symbol)").eq("company_id",company.id).order("created_at",{ascending:false}));
 $("content").innerHTML=`<div class="panel"><div class="toolbar"><input id="psearch" placeholder="بحث بالاسم أو SKU أو Barcode"><button class="btn primary" onclick="openProduct()">+ إضافة منتج</button><button class="btn" onclick="printLabels()">طباعة الباركود</button></div><div id="ptable"></div></div>`;
 $("psearch").oninput=()=>drawProducts($("psearch").value);drawProducts("");
},
sales:async()=>{
 const rows=await api(sb.from("sales").select("*,customers(name)").eq("company_id",company.id).order("created_at",{ascending:false}).limit(300));
 $("content").innerHTML=`<div class="panel"><div class="toolbar"><input id="ssearch" placeholder="بحث برقم الفاتورة أو العميل"></div><div id="stable"></div></div>`;
 const draw=(q="")=>{const r=rows.filter(x=>String(x.invoice_number).includes(q)||String(x.customers?.name||"").includes(q));$("stable").innerHTML=`<table><thead><tr><th>الفاتورة</th><th>العميل</th><th>الحالة</th><th>الإجمالي</th><th>التاريخ</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td>#${x.invoice_number}</td><td>${esc(x.customers?.name||"نقدي")}</td><td><span class="tag">${esc(x.status)}</span></td><td>${money(x.total)}</td><td>${new Date(x.created_at).toLocaleString("ar-EG")}</td><td><button class="btn sm" onclick="printInvoice('${x.id}')">طباعة</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">لا توجد فواتير</td></tr>`}</tbody></table>`};$("ssearch").oninput=e=>draw(e.target.value);draw();
},
purchases:async()=>{
 const rows=await api(sb.from("purchases").select("*,suppliers(name)").eq("company_id",company.id).order("created_at",{ascending:false}).limit(300));
 $("content").innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="openPurchase()">+ فاتورة شراء</button></div><table><thead><tr><th>الفاتورة</th><th>المورد</th><th>الإجمالي</th><th>المدفوع</th><th>التاريخ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.invoice_number||x.id.slice(0,8))}</td><td>${esc(x.suppliers?.name||"-")}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${new Date(x.created_at).toLocaleString("ar-EG")}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">لا توجد مشتريات</td></tr>`}</tbody></table></div>`;
},
customers:async()=>{
 customers=await api(sb.from("customers").select("*").eq("company_id",company.id).order("name"));
 $("content").innerHTML=`<div class="panel"><div class="toolbar"><input id="csearch" placeholder="بحث"><button class="btn primary" onclick="openCustomer()">+ عميل</button></div><div id="ctable"></div></div>`;
 const draw=(q="")=>{let r=customers.filter(x=>x.name.includes(q)||(x.phone||"").includes(q));$("ctable").innerHTML=`<table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المستحق</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone||"-")}</td><td>${money(x.balance_due)}</td><td><button class="btn sm" onclick="customerStatement('${x.id}')">كشف حساب</button></td></tr>`).join("")}</tbody></table>`};$("csearch").oninput=e=>draw(e.target.value);draw();
},
suppliers:async()=>{
 const rows=await api(sb.from("suppliers").select("*").eq("company_id",company.id).order("name"));
 $("content").innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="openSupplier()">+ مورد</button></div><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المستحق</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone||"-")}</td><td>${money(x.balance_due)}</td></tr>`).join("")}</tbody></table></div>`;
},
expenses:async()=>{
 const rows=await api(sb.from("expenses").select("*").eq("company_id",company.id).order("created_at",{ascending:false}).limit(300));
 $("content").innerHTML=`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="openExpense()">+ مصروف</button></div><table><thead><tr><th>العنوان</th><th>التصنيف</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.category||"-")}</td><td>${money(x.amount)}</td><td>${new Date(x.created_at).toLocaleString("ar-EG")}</td></tr>`).join("")}</tbody></table></div>`;
},
stock:async()=>{
 const rows=await api(sb.from("stock").select("*,products(name,sku,barcode,min_stock)").eq("company_id",company.id).eq("branch_id",branch?.id||"00000000-0000-0000-0000-000000000000"));
 $("content").innerHTML=`<div class="panel"><table><thead><tr><th>المنتج</th><th>SKU</th><th>Barcode</th><th>الكمية</th><th>الحد الأدنى</th><th>الحالة</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.products?.name)}</td><td>${esc(x.products?.sku||"-")}</td><td>${esc(x.products?.barcode||"-")}</td><td>${x.quantity}</td><td>${x.products?.min_stock??0}</td><td>${Number(x.quantity)<=Number(x.products?.min_stock||0)?'<span class="tag" style="color:#ffd166">منخفض</span>':'<span class="tag" style="color:#5de6a5">جيد</span>'}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">لا توجد بيانات مخزون</td></tr>`}</tbody></table></div>`;
},
cash:async()=>{
 const rows=await api(sb.from("cash_transactions").select("*").eq("company_id",company.id).order("created_at",{ascending:false}).limit(200));
 $("content").innerHTML=`<div class="panel"><h3>حركات الصندوق</h3><table><thead><tr><th>النوع</th><th>المبلغ</th><th>ملاحظة</th><th>التاريخ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.type)}</td><td>${money(x.amount)}</td><td>${esc(x.note||"-")}</td><td>${new Date(x.created_at).toLocaleString("ar-EG")}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">لا توجد حركات</td></tr>`}</tbody></table></div>`;
},
reports:async()=>{
 const sales=await api(sb.from("sales").select("total,status,created_at").eq("company_id",company.id));
 const completed=sales.filter(x=>x.status==="completed"), total=completed.reduce((a,x)=>a+Number(x.total),0);
 $("content").innerHTML=`<div class="cards"><div class="card metric"><div class="l">إجمالي المبيعات</div><div class="v blue">${money(total)}</div></div><div class="card metric"><div class="l">الفواتير المكتملة</div><div class="v">${completed.length}</div></div></div><div class="panel"><button class="btn" onclick="exportSales()">تصدير CSV</button></div>`;
},
settings:async()=>{
 $("content").innerHTML=`<div class="panel"><h3>إعدادات الفاتورة</h3><div class="formgrid">
<div class="field"><label>رأس الفاتورة</label><input id="setHead" value="${esc(settings.receipt_header||company.name)}"></div>
<div class="field"><label>أسفل الفاتورة</label><input id="setFoot" value="${esc(settings.receipt_footer||"شكرًا لتعاملكم معنا")}"></div>
<div class="field"><label>رقم واتساب</label><input id="setWA" value="${esc(settings.whatsapp_number||"")}"></div>
<div class="field"><label>الضريبة الافتراضية %</label><input id="setTax" type="number" value="${settings.default_tax_rate||0}"></div></div><button class="btn primary" onclick="saveSettings()">حفظ الإعدادات</button></div>`;
}
};
function drawProducts(q){
 const r=products.filter(x=>[x.name,x.sku,x.barcode].some(v=>String(v||"").toLowerCase().includes(q.toLowerCase())));
 $("ptable").innerHTML=`<table><thead><tr><th>المنتج</th><th>Barcode</th><th>SKU</th><th>بيع</th><th>جملة</th><th>إجراء</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.barcode||"-")}</td><td>${esc(x.sku||"-")}</td><td>${money(x.sale_price)}</td><td>${money(x.wholesale_price)}</td><td><button class="btn sm" onclick="openProduct('${x.id}')">تعديل</button></td></tr>`).join("")}</tbody></table>`;
}
function renderPOS(){
 $("content").innerHTML=`<div class="pos"><div><div class="panel"><div class="toolbar"><input id="posSearch" placeholder="ابحث بالاسم / SKU / Barcode" autofocus><button class="btn" onclick="scanBarcode()">كاميرا / قارئ</button></div><div id="posProducts" class="products"></div></div></div><div class="panel cart"><h3>الفاتورة الحالية</h3><div id="cart"></div><div class="field"><label>العميل</label><select id="posCustomer"><option value="">عميل نقدي</option>${customers.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.balance_due)}</option>`).join("")}</select></div><div class="field"><label>طريقة الدفع</label><select id="payMethod"><option value="cash">نقدي</option><option value="card">بطاقة</option><option value="nfc">NFC</option><option value="wallet">محفظة</option><option value="bank_transfer">تحويل بنكي</option></select></div><div class="field"><label>الخصم</label><input id="posDiscount" type="number" value="0" min="0"></div><div class="totals" id="totals"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="checkout()">إتمام البيع وطباعة الفاتورة</button></div></div>`;
 $("posSearch").oninput=e=>drawPOSProducts(e.target.value);$("posDiscount").oninput=drawCart;drawPOSProducts("");drawCart();
}
function drawPOSProducts(q){let r=products.filter(x=>[x.name,x.sku,x.barcode].some(v=>String(v||"").toLowerCase().includes(q.toLowerCase())));$("posProducts").innerHTML=r.slice(0,100).map(x=>`<button class="prod" onclick="addCart('${x.id}')"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.barcode||x.sku||"بدون باركود")}</div><b>${money(x.sale_price)}</b></button>`).join("")||`<div class="empty">لا يوجد منتج</div>`}
function addCart(id){let p=products.find(x=>x.id===id),r=cart.find(x=>x.id===id);if(r)r.qty++;else cart.push({id,product:p,qty:1});drawCart()}
function drawCart(){const sub=cart.reduce((a,x)=>a+x.qty*Number(x.product.sale_price),0),discount=Number($("posDiscount")?.value||0),taxRate=Number(settings.default_tax_rate||0),tax=Math.max(0,sub-discount)*taxRate/100,total=Math.max(0,sub-discount+tax);$("cart").innerHTML=cart.map(x=>`<div class="cartrow"><div><b>${esc(x.product.name)}</b><br><small>${money(x.product.sale_price)}</small></div><div class="qty"><button onclick="chg('${x.id}',-1)">−</button>${x.qty}<button onclick="chg('${x.id}',1)">+</button></div><b>${money(x.qty*x.product.sale_price)}</b></div>`).join("")||`<div class="empty">السلة فارغة</div>`;$("totals").innerHTML=`<div class="totalrow"><span>الإجمالي الفرعي</span><b>${money(sub)}</b></div><div class="totalrow"><span>الخصم</span><b>${money(discount)}</b></div><div class="totalrow"><span>الضريبة</span><b>${money(tax)}</b></div><div class="totalrow grand"><span>الإجمالي</span><b>${money(total)}</b></div>`}
function chg(id,n){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);drawCart()}
async function checkout(){
 if(!cart.length)return toast("السلة فارغة");
 const discount=Number($("posDiscount").value||0),sub=cart.reduce((a,x)=>a+x.qty*Number(x.product.sale_price),0),taxRate=Number(settings.default_tax_rate||0),tax=Math.max(0,sub-discount)*taxRate/100,total=Math.max(0,sub-discount+tax);
 try{
   const items=cart.map(x=>({product_id:x.id,quantity:x.qty,unit_price:Number(x.product.sale_price),discount:0,tax:0}));
   const data=await api(sb.rpc("create_sale",{p_company_id:company.id,p_branch_id:branch?.id,p_customer_id:$("posCustomer").value||null,p_status:"completed",p_discount:discount,p_tax:tax,p_notes:null,p_payment_method:$("payMethod").value,p_paid_amount:total,p_items:items}));
   cart=[];await printInvoice(data.sale_id);await navigate("pos");
 }catch(e){toast("فشل إتمام البيع: "+e.message)}
}
async function printInvoice(id){
 const sale=await api(sb.from("sales").select("*,customers(name,phone)").eq("id",id).single()),items=await api(sb.from("sale_items").select("*,products(name,barcode)").eq("sale_id",id));
 const w=window.open("","_blank","width=420,height=700");if(!w)return toast("المتصفح منع نافذة الطباعة");
 w.document.write(`<html dir="rtl"><head><title>فاتورة #${sale.invoice_number}</title><style>body{margin:0;background:#eee}.receipt{width:80mm;background:#fff;color:#000;padding:7mm;margin:auto;font-family:Arial,sans-serif}.receipt h2,.receipt p{text-align:center;margin:4px 0}.receipt table{width:100%;border-collapse:collapse;font-size:12px}.receipt th,.receipt td{padding:4px;border-bottom:1px dashed #999}.r-total{display:flex;justify-content:space-between;font-size:17px;font-weight:bold;margin-top:8px}@media print{@page{size:80mm auto;margin:0}body{background:#fff}}</style></head><body><div class="receipt"><h2>${esc(settings.receipt_header||company.name)}</h2><p>فاتورة #${sale.invoice_number}</p><p>${new Date(sale.created_at).toLocaleString("ar-EG")}</p><p>العميل: ${esc(sale.customers?.name||"نقدي")}</p><table><tr><th>الصنف</th><th>ك</th><th>السعر</th></tr>${items.map(x=>`<tr><td>${esc(x.products?.name)}</td><td>${x.quantity}</td><td>${money(x.line_total)}</td></tr>`).join("")}</table><div class="r-total"><span>الإجمالي</span><span>${money(sale.total)}</span></div><p>${esc(settings.receipt_footer||"شكرًا لتعاملكم معنا")}</p></div><script>window.onload=()=>{window.print()}<\/script></body></html>`);w.document.close();
}
function openProduct(id){
 const p=id?products.find(x=>x.id===id):{};
 modal(`<h3>${id?"تعديل منتج":"إضافة منتج"}</h3><div class="formgrid">
 <div class="field"><label>اسم المنتج</label><input id="fName" value="${esc(p.name||"")}"></div>
 <div class="field"><label>Barcode</label><input id="fBarcode" value="${esc(p.barcode||"")}"></div>
 <div class="field"><label>SKU</label><input id="fSku" value="${esc(p.sku||"")}"></div>
 <div class="field"><label>سعر التكلفة</label><input id="fCost" type="number" value="${p.cost_price||0}"></div>
 <div class="field"><label>سعر البيع</label><input id="fSale" type="number" value="${p.sale_price||0}"></div>
 <div class="field"><label>سعر الجملة</label><input id="fWhole" type="number" value="${p.wholesale_price||0}"></div>
 <div class="field"><label>الضريبة %</label><input id="fTax" type="number" value="${p.tax_rate||0}"></div>
 <div class="field"><label>حد المخزون</label><input id="fMin" type="number" value="${p.min_stock||0}"></div>
 </div><div class="actions"><button class="btn primary" onclick="saveProduct('${id||""}')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
}
async function saveProduct(id){
 const row={company_id:company.id,name:$("fName").value.trim(),barcode:$("fBarcode").value.trim()||null,sku:$("fSku").value.trim()||null,cost_price:Number($("fCost").value||0),sale_price:Number($("fSale").value||0),wholesale_price:Number($("fWhole").value||0),tax_rate:Number($("fTax").value||0),min_stock:Number($("fMin").value||0),is_active:true};
 try{if(id)await api(sb.from("products").update(row).eq("id",id).eq("company_id",company.id));else await api(sb.from("products").insert(row));closeModal();navigate("products")}catch(e){toast(e.message)}
}
function openCustomer(){modal(`<h3>إضافة عميل</h3><div class="formgrid"><div class="field"><label>الاسم</label><input id="cn"></div><div class="field"><label>الهاتف</label><input id="cp"></div><div class="field full"><label>العنوان</label><input id="ca"></div></div><button class="btn primary" onclick="saveCustomer()">حفظ</button>`)}
async function saveCustomer(){try{await api(sb.from("customers").insert({company_id:company.id,name:$("cn").value.trim(),phone:$("cp").value.trim()||null,address:$("ca").value.trim()||null}));closeModal();navigate("customers")}catch(e){toast(e.message)}}
function openSupplier(){modal(`<h3>إضافة مورد</h3><div class="formgrid"><div class="field"><label>الاسم</label><input id="sn"></div><div class="field"><label>الهاتف</label><input id="sp"></div><div class="field full"><label>العنوان</label><input id="sa"></div></div><button class="btn primary" onclick="saveSupplier()">حفظ</button>`)}
async function saveSupplier(){try{await api(sb.from("suppliers").insert({company_id:company.id,name:$("sn").value.trim(),phone:$("sp").value.trim()||null,address:$("sa").value.trim()||null}));closeModal();navigate("suppliers")}catch(e){toast(e.message)}}
function openExpense(){modal(`<h3>تسجيل مصروف</h3><div class="formgrid"><div class="field"><label>العنوان</label><input id="en"></div><div class="field"><label>التصنيف</label><input id="ec"></div><div class="field"><label>المبلغ</label><input id="ea" type="number"></div></div><button class="btn primary" onclick="saveExpense()">حفظ</button>`)}
async function saveExpense(){try{await api(sb.from("expenses").insert({company_id:company.id,branch_id:branch?.id,created_by:session.user.id,title:$("en").value.trim(),category:$("ec").value.trim()||null,amount:Number($("ea").value||0)}));closeModal();navigate("expenses")}catch(e){toast(e.message)}}
function openPurchase(){modal(`<h3>فاتورة شراء</h3><p style="color:var(--muted)">هذه الشاشة تعتمد على RPC المشتريات بعد تشغيل ملف SQL المرفق. الواجهة الأساسية جاهزة.</p><button class="btn" onclick="closeModal()">إغلاق</button>`)}
function customerStatement(id){navigate("sales")}
function scanBarcode(){const v=prompt("اكتب/امسح Barcode:");if(v){$("posSearch").value=v;drawPOSProducts(v)}}
function printLabels(){toast("حدد المنتجات أولًا في نسخة الملصقات المتقدمة.")}
function exportSales(){toast("تصدير التقرير سيتم من بيانات المبيعات الحالية.")}
async function saveSettings(){try{const row={company_id:company.id,receipt_header:$("setHead").value,receipt_footer:$("setFoot").value,whatsapp_number:$("setWA").value,default_tax_rate:Number($("setTax").value||0),updated_at:new Date().toISOString()};await api(sb.from("settings").upsert(row));settings=row;toast("تم الحفظ")}catch(e){toast(e.message)}}
function modal(html){$("modalBox").innerHTML=html;$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
sb.auth.onAuthStateChange((_e,s)=>{if(s&&!session)boot()});
boot();
</script>
